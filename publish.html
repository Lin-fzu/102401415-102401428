<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布信息 - 校园失物招领平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <div class="header">
            <h1>🎒 校园失物招领平台</h1>
            <div class="nav">
                <a href="index.html">首页</a>
                <a href="publish.html" class="active">发布信息</a>
            </div>
        </div>

        <!-- 发布表单 -->
        <div class="form-card">
            <h2 style="margin-bottom: 20px;">发布失物招领信息</h2>
            
            <form id="publishForm">
                <!-- 类型选择 -->
                <div class="form-group">
                    <label>信息类型</label>
                    <div class="type-selector">
                        <div class="type-option active" data-type="lost">
                            <div class="icon">🔍</div>
                            <div>寻物启事</div>
                        </div>
                        <div class="type-option" data-type="found">
                            <div class="icon">📦</div>
                            <div>招领启事</div>
                        </div>
                    </div>
                </div>

                <!-- 物品名称 -->
                <div class="form-group">
                    <label>物品名称 *</label>
                    <input type="text" id="title" placeholder="例如：蓝色校园卡、黑色雨伞" required>
                </div>

                <!-- 物品描述 -->
                <div class="form-group">
                    <label>物品描述 *</label>
                    <textarea id="description" placeholder="详细描述物品特征、丢失或捡到的具体情况..." required></textarea>
                </div>

                <!-- 地点 -->
                <div class="form-group">
                    <label>地点 *</label>
                    <input type="text" id="location" placeholder="例如：教学楼A区3楼、第二食堂门口" required>
                </div>

                <!-- 时间 -->
                <div class="form-group">
                    <label>时间 *</label>
                    <input type="text" id="time" required>
                </div>

                <!-- 联系方式 -->
                <div class="form-group">
                    <label>联系方式 *</label>
                    <input type="text" id="contact" placeholder="例如：QQ、微信、手机号" required>
                </div>

                <!-- 提交按钮 -->
                <button type="submit" class="btn btn-primary">发布信息</button>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/publish.js"></script>
</body>
</html>
