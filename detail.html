<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信息详情 - 校园失物招领平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 顶部标题栏 -->
        <div class="page-title-bar">
            <span class="back-btn" onclick="history.back()">‹ 返回</span>
            信息详情
        </div>

        <!-- 详情卡片 -->
        <div class="detail-card">
            <div class="detail-header">
                <h2 class="detail-title" id="detailTitle">加载中...</h2>
                <div>
                    <span class="item-type" id="detailType"></span>
                    <span class="item-status" id="detailStatus" style="margin-left: 10px;"></span>
                </div>
            </div>

            <div class="detail-section">
                <h3>物品描述</h3>
                <p id="detailDescription"></p>
            </div>

            <div class="detail-section">
                <h3>地点</h3>
                <p id="detailLocation"></p>
            </div>

            <div class="detail-section">
                <h3>时间</h3>
                <p id="detailTime"></p>
            </div>

            <div class="contact-info">
                <h3 style="font-size: 13px; color: #999; margin-bottom: 6px;">联系方式</h3>
                <p id="detailContact" style="font-size: 15px; color: #2d3436;"></p>
            </div>

            <!-- 操作按钮 -->
            <div class="action-buttons" id="actionButtons" style="display: none;">
                <button class="btn btn-primary" id="markFoundBtn">标记为已找到</button>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="icon">🏠</span>
            <span>首页</span>
        </a>
        <a href="publish.html" class="nav-item">
            <span class="icon">✏️</span>
            <span>发布</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="icon">👤</span>
            <span>我的</span>
        </a>
    </div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/detail.js"></script>
</body>
</html>
