<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信息详情 - 校园失物招领平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <div class="header">
            <h1>🎒 校园失物招领平台</h1>
            <div class="nav">
                <a href="index.html">首页</a>
                <a href="publish.html">发布信息</a>
            </div>
        </div>

        <!-- 详情卡片 -->
        <div class="detail-card">
            <div class="detail-header">
                <h2 class="detail-title" id="detailTitle">加载中...</h2>
                <div>
                    <span class="item-type" id="detailType"></span>
                    <span class="item-status" id="detailStatus" style="margin-left: 10px;"></span>
                </div>
            </div>

            <div class="detail-section">
                <h3>物品描述</h3>
                <p id="detailDescription"></p>
            </div>

            <div class="detail-section">
                <h3>地点</h3>
                <p id="detailLocation"></p>
            </div>

            <div class="detail-section">
                <h3>时间</h3>
                <p id="detailTime"></p>
            </div>

            <div class="contact-info">
                <h3 style="font-size: 14px; color: #999; margin-bottom: 8px;">联系方式</h3>
                <p id="detailContact" style="font-size: 16px; color: #2d3436;"></p>
            </div>

            <!-- 操作按钮 -->
            <div class="action-buttons" id="actionButtons" style="display: none;">
                <button class="btn btn-primary" id="markFoundBtn">标记为已找到</button>
                <button class="btn btn-secondary" id="markReturnedBtn">标记为已归还</button>
            </div>
        </div>

        <!-- 返回按钮 -->
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn btn-secondary" onclick="history.back()">返回首页</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/detail.js"></script>
</body>
</html>
