<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园失物招领平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <div class="header">
            <h1>🎒 校园失物招领平台</h1>
            <div class="nav">
                <a href="index.html" class="active">首页</a>
                <a href="publish.html">发布信息</a>
            </div>
        </div>

        <!-- 搜索栏 -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索物品名称...">
            <button id="searchBtn">搜索</button>
        </div>

        <!-- 分类筛选 -->
        <div class="filter-tabs">
            <div class="filter-tab active" data-type="all">全部</div>
            <div class="filter-tab" data-type="lost">寻物</div>
            <div class="filter-tab" data-type="found">招领</div>
        </div>

        <!-- 物品列表 -->
        <div class="item-list" id="itemList">
            <!-- 动态渲染 -->
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
